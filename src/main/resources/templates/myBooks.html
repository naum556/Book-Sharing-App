<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Listing</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.css.map">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.bundle.min.js"></script>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            padding: 0;
            margin: 0;
            background: rgb(255,255,255);
            background: linear-gradient(90deg, rgba(255,255,255,1) 0%, rgba(142,190,255,1) 0%, rgba(230,235,255,1) 25%);
        }

        .navbar {
            background-color: #0d6efd;
            z-index: 1;
            min-height: 60px;
            display: flex;
            align-items: center;
        }

        .navbar a {
            color: white;
        }


        .menu {
            /*position: absolute;*/
            /*top: 0;*/
            /*left: 0;*/
            /*width: 250px;*/
            /*height: 979px;*/
            /*background-color: #734ee1;*/
            /*padding: 20px;*/
            /*transition: 0.3s ease;*/
            /*transform: translateX(-250px);*/

            position: fixed;
            top: 0;
            left: 0;
            width: 250px;
            height: 100%;
            background-color: #734ee1;
            padding: 20px;
            transition: 0.3s ease;
            transform: translateX(-250px);
        }

        .menu a {
            color: white;
            font-weight: 500;
            text-decoration: none;
        }

        .menu ul li {
            list-style: none;
        }

        .menu h1 {
            text-align: center;
            color: white;
        }

        .menu ul li a {
            padding: 20px 0;
            display: block;
            font-size: 20px;
        }

        label input {
            display: none;
        }

        .toggle {
            position: absolute;
            top: 8px;
            left: 30px;
            height: 45px;
            width: 50px;
            cursor: pointer;
            z-index: 2;
        }

        .toggle .common {
            position: absolute;
            height: 2px;
            width: 20px;
            background-color: #ffffff;
            transition: 0.3s ease;
        }

        .toggle .top_line {
            top: 30%;
        }

        .toggle .middle_line {
            top: 50%;
        }

        .toggle .bottom_line {
            top: 70%;
        }

        input:checked ~ .menu {
            transform: translateX(0);
        }


        .card {
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 10px;
            margin: 15px;
            text-align: center;
            transition: transform 0.2s;
            width: 334px;
            height: 425px;
        }

        .card:hover {
            transform: scale(1.05);
            cursor: pointer;
        }

        .card img {
            width: 230px;
            height: 308px;
            border-radius: 5px;
            margin-left: 42px;
        }

        .book-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-evenly;
            margin-top: 12%;
        }

        .modal-body img {
            max-width: 235px;
            margin-bottom: 15px;
            margin-left: 110px;
        }


        .yourbooks {
            color: #2b2f32;
            text-align: center;
            position: absolute;
            margin-left: 36%;
            margin-top: 1%;
            font-size: 55px;
            background-size: cover;
            width: 515px;
            height: 215px;
        }


        @media (max-width: 768px) {
            .yourbooks {
                margin-left: 10%;
                margin-top: 10%;
                font-size: 24px;
                width: 80%;
                height: auto;
                line-height: 1.5;
                background-size: 100% 100%;
            }

            .yourbooks h1 {
                line-height: normal;
            }
        }
    </style>
</head>
<body>


<!--Navbar-->

<nav class="navbar navbar-expand-lg">
    <label>
        <input type="checkbox">
        <div class="toggle">
            <span class="top_line common"></span>
            <span class="middle_line common"></span>
            <span class="bottom_line common"></span>
        </div>

        <div class="menu">
            <h1>Menu</h1>
            <ul>
                <li><a href="/home"><i class="bi bi-house"></i> Home</a></li>
                <li><a href="/books"><i class="bi bi-search"></i> Search Books</a></li>
                <li><a href="/books/add-form"><i class="bi bi-book"></i> Add Book</a></li>
                <li><a href="/books/myBooks"><i class="bi bi-bookshelf"></i> My Library</a></li>
                <li><a href="/logout"> Sign Out</a></li>
            </ul>
        </div>
    </label>

    <div class="collapse navbar-collapse d-flex justify-content-between" id="navbarSupportedContent">
        <form class="d-flex ms-auto search-form" method="GET" action="/books/search">
            <input class="form-control me-2" type="text" name="title" id="title" placeholder="Search for books..." aria-label="Search">
            <button class="btn btn-outline-success" type="submit" value="Search">Search</button>
        </form>
        <ul class="navbar-nav">
            <li class="nav-item active">
                <a class="nav-link" href="/logout">Sign Out</a>
            </li>
        </ul>
    </div>
</nav>


<div class="yourbooks">
    <h1>My Books</h1>
</div>

<div class="book-container">
    <div th:each="book : ${myBooks}">
        <div class="card">
            <img th:src="${book.getImage()}" alt="Book Image" class="book-img" data-toggle="modal" th:data-target="'#bookModal' + ${book.getId()}">
            <h5 th:text="${book.getName()}"></h5>
            <p th:text="${book.getCategory()}"></p>
            <p th:text="'Available: ' + ${book.getAvailableCopies()}"></p>
        </div>

        <!-- Modal -->
        <div th:id="'bookModal' + ${book.getId()}" class="modal fade" tabindex="-1" role="dialog">
            <div class="modal-dialog" role="document">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" th:text="${book.getName()}"></h5>
                        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                            <span aria-hidden="true">&times;</span>
                        </button>
                    </div>
                    <div class="modal-body">
                        <img th:src="${book.getImage()}" alt="Book Image">
                        <p><strong>Author:</strong> <span th:text="${book.getAuthor()}"></span></p>
                        <p><strong>Description:</strong> <span th:text="${book.getDesc()}"></span></p>
                        <p><strong>Category:</strong> <span th:text="${book.getCategory()}"></span></p>
                        <p><strong>Price:</strong> <span th:text="${book.getPrice()}"></span></p>
                        <p><strong>Available Copies:</strong> <span th:text="${book.getAvailableCopies()}"></span></p>
                    </div>
                    <div class="modal-footer">
                        <form th:action="@{'/books/delete/{id}' (id=${book.getId()})}" th:method="DELETE">
                            <button type="submit" class="btn btn-danger">Delete</button>
                        </form>
                        <a th:href="@{'/books/edit-form/{id}' (id=${book.getId()})}" class="btn btn-info">Edit</a>
                        <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
