<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/homepage.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.css.map">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script defer src ="js/bootstrap.bundle.min.js"></script>
    <title>Mobile Compatible Homepage</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            padding: 0;
            margin: 0;

        }

        .navbar {
            background-color: #0d6efd;
            z-index: 1;
            min-height: 60px;
            display: flex;
            align-items: center;
        }

        .navbar a {
            color: white;
        }


        .menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 250px;
            height: 979px;
            background-color: #734ee1;
            padding: 20px;
            transition: 0.3s ease;
            transform: translateX(-250px);
        }

        .menu a {
            color: white;
            font-weight: 500;
            text-decoration: none;
        }

        .menu ul li {
            list-style: none;
        }

        .menu h1 {
            text-align: center;
            color: white;
        }

        .menu ul li a {
            padding: 20px 0;
            display: block;
            font-size: 20px;
        }

        label input {
            display: none;
        }

        .toggle {
            position: absolute;
            top: 8px;
            left: 30px;
            height: 45px;
            width: 50px;
            cursor: pointer;
            z-index: 2;
        }

        .toggle .common {
            position: absolute;
            height: 2px;
            width: 20px;
            background-color: #ffffff;
            transition: 0.3s ease;
        }

        .toggle .top_line {
            top: 30%;
        }

        .toggle .middle_line {
            top: 50%;
        }

        .toggle .bottom_line {
            top: 70%;
        }

        input:checked ~ .menu {
            transform: translateX(0);
        }


        #middle {
            background-image: url("https://st3.depositphotos.com/25371908/32587/i/450/depositphotos_325873958-stock-photo-public-library-book-store-blurred.jpg");
            background-size: cover;
            background-position: center;
            min-height: 100vh; /* This ensures it fills the entire viewport height */
            color: white;
            text-align: center;
            margin: 0; /* Remove any margin that might cause extra space */
            padding: 0; /* Remove padding if any */
        }


        #middle h1 {
            padding-top: 200px;
            font-size: 40px;
        }

        .search {
            margin-top: 30px;
            background: #ffffff;
            border-radius: 30px;
            padding: 30px;
            display: flex;
            width: 90%;
            max-width: 1500px;
            margin-left: auto;
            margin-right: auto;
        }

        .search-input {
            font-size: 16px;
            color: #333;
            margin-left: 10px;
            outline: none;
            border: none;
            flex: 1;
        }

        .search-input::placeholder {
            color: rgba(0, 0, 0, 0.5);
        }


        .boxcontainer {
            display: flex;
            justify-content: center;
            margin-top: 30px;
        }

        .boxcontainer button {
            border: none;
            border-radius: 20px;
            padding: 40px 99px;
            margin: 10px;
            font-size: 34px;
            font-weight: 600;
            background: linear-gradient(to right, #0d6efd, #ea3c3c);
            color: white;
            transition: transform 0.3s ease;
        }

        .boxcontainer button:hover {
            transform: scale(1.1);
        }



        @media (max-width: 768px) {
            #middle h1 {
                font-size: 28px;
            }

            .search {
                width: 100%;
            }

            .boxcontainer {
                flex-direction: column;
            }

            .boxcontainer button {
                width: 90%;
                margin: 10px auto;
            }
        }

        @media (max-width: 480px) {
            .toggle {
                left: 10px;
            }

            .boxcontainer button {
                font-size: 16px;
                padding: 12px 20px;
            }

            .search {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>

<!-- Navbar -->

<nav class="navbar navbar-expand-lg">
    <label>
        <input type="checkbox">
        <div class="toggle">
            <span class="top_line common"></span>
            <span class="middle_line common"></span>
            <span class="bottom_line common"></span>
        </div>

        <div class="menu">
            <h1>Menu</h1>
            <ul>
                <li><a href="/home"><i class="bi bi-house"></i> Home</a></li>
                <li><a href="/books"><i class="bi bi-search"></i> Search Books</a></li>
                <li><a href="/books/add-form"><i class="bi bi-book"></i> Add Book</a></li>
                <li><a href="/books/myBooks"><i class="bi bi-bookshelf"></i> My Library</a></li>
                <li><a href="/logout"> Sign Out</a></li>
            </ul>
        </div>
    </label>
</nav>

<!-- Main -->

<main id="middle">
    <h1>Discover Books You'll Love</h1>

    <div class="search">
        <form method="GET" action="/books/search">
            <input class="search-input" type="text" id="title" name="title" placeholder="Search for books...">
        </form>
    </div>

    <div class="boxcontainer">
        <button><a href="/books/myBooks" style="color: white; text-decoration: none;"><i class="bi bi-bookshelf"></i> View Books</a></button>
        <button><a href="/books/add-form" style="color: white; text-decoration: none;"><i class="bi bi-book"></i> Add Book</a></button>
    </div>
</main>



</body>
</html>
