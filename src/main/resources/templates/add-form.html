<script>
    let currentSlide = 0;
    const slides = document.querySelectorAll('.slide');
    let selectedGenre = ''; // Variable to hold the selected genre

    // Function to show a specific slide
    function showSlide(index) {
        slides.forEach((slide, i) => {
            slide.classList.toggle('active', i === index);
        });
        currentSlide = index;

        // If on slide 3, populate the category input field with the selected genre
        if (index === 2 && selectedGenre) {
            const categoryInput = document.getElementById('category');
            categoryInput.value = selectedGenre; // Set the selected genre to the category input
        }
    }

    // Initialize the first slide as active
    showSlide(currentSlide);

    // Event listeners for genre selection (books)
    const books = document.querySelectorAll('.bookshelf .book, .bookshelf .book1, .bookshelf .book2, .bookshelf .book3, .bookshelf .book4, .bookshelf .book5, .bookshelf .book6, .bookshelf .book7, .bookshelf .book8, .bookshelf .book9, .bookshelf .book10, .bookshelf .book11, .bookshelf .book12');

    books.forEach(book => {
        book.addEventListener('click', () => {
            // Get the genre text from the clicked book
            const genreText = book.querySelector('div').textContent;
            selectedGenre = genreText; // Store the selected genre

            // Go to slide 2 when a genre is clicked
            showSlide(1);
        });
    });

    // Rent button functionality
    document.querySelector('.rent').addEventListener('click', () => {
        // Show slide 3
        showSlide(2);

    });

    // Add button functionality
    document.querySelector('.add').addEventListener('click', () => {
        // Set the price to 0
        const priceInput = document.getElementById('price');
        priceInput.value = '0'; // Set price to 0

        priceInput.setAttribute('readonly', true);

        // Show slide 3
        showSlide(2);
    });

</script>
