<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/registration.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script defer src ="js/bootstrap.bundle.min.js"></script>
    <script defer src = js/registration.js></script>
    <title>Title</title>
    <style>

        .container {
            border: 2px solid grey;
            border-radius: 10px;
            width: 800px;
            height: auto;
            margin: 12% auto;
            box-shadow: 0 0 20px 2px rgba(0, 0, 0, 0.5);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .container h1 {
            text-align: center;
            font-weight: bolder;
            font-size: 50px;
            margin-top: 20px;
        }

        .input-box {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .input-box label {
            font-size: 18px;
        }

        .input-box input {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid grey;
        }

        .input-box button{
            background-color: #0d6efd;
            color: white;
            width: 190px;
            height: 80px;
            line-height: 70px;
            border-radius: 20px;
            border: none;
            font-size: 20px;
            margin: auto;
            margin-top: 20px;


        }

        .navbar a{
            color: white;
        }

        .input-box button:hover{
            background: linear-gradient(90deg, rgba(2,0,36,1) 0%, rgba(13,110,240,1) 0%, rgba(0,212,255,1) 0%);
        }

        .input-box .error {
            color: red;
            font-size: 14px;
        }

        .input-box input.error-border {
            border: 1px solid red;
        }


        .messageDiv{
            background-color: springgreen;
            color: white;
            padding: 10px 20px;
            margin: 10px;
            border-radius: 5px;
            font-size: 1rem;
            opacity: 0;
            animation: fadeOut 7s forwards;
        }

    </style>

</head>
<body>


<!--Navbar-->

<nav class="navbar navbar-expand-lg" style="background-color: #0d6efd">
    <a class="navbar-brand" href="/main">Home</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto">
            <li class="nav-item active">
                <a class="nav-link" href="/login">Sign In <span class="visually-hidden">(current)</span></a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/register">Sign Up</a>
            </li>

            <!--            <li class="nav-item">-->
            <!--                <a class="nav-link disabled" href="#">Disabled</a>-->
            <!--            </li>-->
        </ul>
        <form class="d-flex ms-auto">
            <input class="form-control me-2" type="search" placeholder="Search for books..." aria-label="Search">
            <button class="btn btn-outline-success" id="submitSignUp" type="submit">Search</button>
        </form>
    </div>
</nav>


<div class="container">

    <form method="post" th:action="@{'/register'}">
        <h1>Sign Up</h1>
        <div id="SignUpMessage" class="messageDiv" style="display: none"></div>
        <div class="input-box">
            <label for="username">Name:</label>
            <input type="text" id="username"  name="username" placeholder="John">
        </div>


        <div class="input-box">
            <label for="password">Password:</label>
            <input type="password" name="password" id="password">
            <div class="error"></div>
        </div>

        <div class="input-box">
            <label for="confirmPassword">Confirm Password:</label>
            <input type="password" name="confirmPassword"  id="confirmPassword">
            <div class="error"></div>
        </div>

        <div class="input-box">
            <label for="email">E-mail:</label>
            <input type="text" id="email" name="email" placeholder="johndoe@gmail.com">
            <div class="error"></div>
        </div>

        <p>
        <div class="form-check form-check-inline">
            <input class="form-check-input" name="role" type="radio" id="ROLE_ADMIN" value="ROLE_ADMIN">
            <label class="form-check-label" for="ROLE_ADMIN">ROLE_ADMIN</label>
        </div>
        <div class="form-check form-check-inline">
            <input class="form-check-input" name="role"  type="radio" id="ROLE_USER" value="ROLE_USER">
            <label class="form-check-label" for="ROLE_USER">ROLE_USER</label>
        </div>
        </p>

        <div class="input-box">
            <button type="submit" id="signup-button">Create Account</button>
        </div>

    </form>

</div>




</body>
</html>
